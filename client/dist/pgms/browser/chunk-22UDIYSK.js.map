<div class="pagination-wrapper p-2 px-3 card-theme-color rounded mb-2 border">

    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">

        <!-- Rows Per Page Selector -->
        <div class="limit-wrapper d-flex align-items-center gap-2">
            <span class="fs-11 text-muted fw-medium">Rows per page:</span>
            <select (change)="setLimit(limit.value)" #limit class="form-select form-select-sm limit-select">
                <option value="10">10</option>
                <option value="15">15</option>
                <option value="20">20</option>
                <option value="25">25</option>
                <option value="30">30</option>
            </select>
        </div>

        <!-- Page Controls -->
        <div class="pagination-controls d-flex align-items-center gap-1">
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm m-0 cursor-pointer align-items-center gap-1">
                    <li class="page-item" [class.disabled]="page_no() <= 1" (click)="first()" title="First Page">
                        <a class="page-link custom-page-link" aria-label="First">
                            <i class="bi bi-chevron-double-left"></i>
                        </a>
                    </li>
                    <li class="page-item" [class.disabled]="page_no() <= 1" (click)="previous()" title="Previous Page">
                        <a class="page-link custom-page-link" aria-label="Previous">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>

                    <li class="page-item active-page-item">
                        <span class="page-indicator fs-11 fw-semibold">
                            Page {{page_no()}} @if (total_pages()) { <span class="text-muted fw-normal">of {{total_pages()}}</span> }
                        </span>
                    </li>

                    <li class="page-item" (click)="next()" [class.disabled]="page_no() >= total_pages() || page_no() == 0" title="Next Page">
                        <a class="page-link custom-page-link" aria-label="Next">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                    <li class="page-item" (click)="last()" [class.disabled]="page_no() >= total_pages() || page_no() == 0" title="Last Page">
                        <a class="page-link custom-page-link" aria-label="Last">
                            <i class="bi bi-chevron-double-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

    </div>

</div>
